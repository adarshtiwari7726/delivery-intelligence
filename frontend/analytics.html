<!DOCTYPE html>
<html lang="en">
<head>
    <script>window.DELIVERY_API_BASE = "https://delivery-intelligence.onrender.com";</script>
<meta charset="UTF-8" />
<title>Analytics · Delivery Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar-root"></nav>
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">ASIN Analysis</h1>
        <p class="page-sub">See how one ASIN performs across every PIN code it has been checked against.</p>
      </div>
    </div>

    <div class="card">
      <div class="form-row">
        <div class="field" style="max-width:280px;">
          <label>ASIN</label>
          <input type="text" id="analysis-asin" placeholder="B0XXXXXXXXXX" maxlength="10" />
        </div>
        <div class="field" style="align-self:flex-end; max-width:140px;">
          <button class="btn btn-primary" id="analyze-btn">Analyze</button>
        </div>
      </div>
    </div>

    <div id="analysis-result"></div>
  </main>
</div>
<div id="toast-root"></div>
<script src="js/app.js"></script>
<script src="js/analytics.js"></script>
<script>renderSidebar('analytics.html');</script>
</body>
</html>
