<!DOCTYPE html>
<html lang="en">
<head>
    <script>window.DELIVERY_API_BASE = "http://100.107.158.103:4000";</script>
<meta charset="UTF-8" />
<title>Single Check · Delivery Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar-root"></nav>
  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">Single Check</h1>
        <p class="page-sub">Check the delivery promise for one ASIN to one Indian PIN code.</p>
      </div>
    </div>

    <div class="card">
      <form id="check-form">
        <div class="form-row">
          <div class="field">
            <label for="asin">Amazon ASIN</label>
            <input type="text" id="asin" placeholder="B0XXXXXXXXXX" maxlength="10" autocomplete="off" />
            <div class="field-error hidden" id="err-asin"></div>
          </div>
          <div class="field">
            <label for="pin">PIN Code</label>
            <input type="text" id="pin" placeholder="380001" maxlength="6" autocomplete="off" />
            <div class="field-error hidden" id="err-pin"></div>
          </div>
          <div class="field" style="max-width:120px;">
            <label for="qty">Quantity</label>
            <input type="number" id="qty" value="1" min="1" max="999" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Check Delivery</button>
      </form>
    </div>

    <div id="result-container" style="margin-top:16px;"></div>
  </main>
</div>
<div id="toast-root"></div>
<script src="js/app.js"></script>
<script src="js/singleCheck.js"></script>
<script>renderSidebar('single-check.html');</script>
</body>
</html>
